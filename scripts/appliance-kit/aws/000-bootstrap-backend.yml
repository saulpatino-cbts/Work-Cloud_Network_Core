name: "000 · Bootstrap Backend"

@@SCAFFOLD_HEADER@@
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      region:
        description: AWS region for the state backend and the environment
        required: true
        default: us-east-1
        type: string
      region_short:
        description: Short region code used in resource names (e.g. use1)
        required: true
        default: use1
        type: string
      tfstate_bucket:
        description: S3 bucket for Terraform state (versioning + SSE-KMS); globally unique
        required: true
        type: string
      tfstate_lock_table:
        description: DynamoDB table for state locking (LockID partition key)
        required: true
        default: cna-tfstate-lock
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: self-hosted
    steps:
      - name: Blocked on AWS account setup
        run: |
          echo "::error::000-bootstrap-backend cannot run yet: no AWS account and no OIDC deploy role exist (REVIEW.md R-001, R-003)."
          echo "::error::When they do, this job creates the S3 state bucket and DynamoDB lock table named in the inputs and records the four -backend-config values as repository variables (REVIEW.md R-002 describes them). Implementation: TODO.md T-102."
          exit 1
