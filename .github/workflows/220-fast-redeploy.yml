name: "220 · Fast Redeploy"
# Fast image update without a full Terraform apply.
# Use this when you only need to roll out a new container image to
# one or more Container Apps — no infrastructure changes.
# ~2 minutes vs ~10+ minutes for a full Terraform deploy.
# Prerequisite:
#   Azure infrastructure must already be deployed by workflow 211.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      resource_group:
        description: Optional workload resource group override (default derived from TFSTATE_RESOURCE_GROUP)
        required: false
        default: ""
        type: string
      api_image:
        description: New cna-api image (leave empty to skip)
        required: false
        default: ""
        type: string
      worker_image:
        description: New cna-worker image (leave empty to skip)
        required: false
        default: ""
        type: string
      web_image:
        description: New cna-web image (leave empty to skip)
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

# Serialize redeploys per environment so two overlapping runs don't race to
# update the same Container Apps revision; don't cancel an in-flight rollout.
concurrency:
  group: fast-redeploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate — at least one image must be specified
        run: |
          if [ -z "${{ inputs.api_image }}" ] && \
             [ -z "${{ inputs.worker_image }}" ] && \
             [ -z "${{ inputs.web_image }}" ]; then
            echo "::error::At least one image (api_image, worker_image, or web_image) must be specified."
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Derive Container App names from environment
        id: names
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_RG: ${{ inputs.resource_group }}
          TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [ -n "$INPUT_RG" ]; then
            WORKLOAD_RG="$INPUT_RG"
          elif [ -n "$TFSTATE_RG" ] && [[ "$TFSTATE_RG" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RG%-tfstate}"
          elif [ -n "$REGION_SHORT" ]; then
            WORKLOAD_RG="rg-cna-${INPUT_ENV}-${REGION_SHORT}"
          else
            echo "::error::AZURE_REGION_SHORT is required when TFSTATE_RESOURCE_GROUP is not set."
            exit 1
          fi

          PREFIX="${WORKLOAD_RG#rg-}"
          echo "api_app=${PREFIX}-ca-api"       >> "$GITHUB_OUTPUT"
          echo "worker_app=${PREFIX}-ca-worker" >> "$GITHUB_OUTPUT"
          echo "web_app=${PREFIX}-ca-web"       >> "$GITHUB_OUTPUT"
          echo "resource_group=${WORKLOAD_RG}"  >> "$GITHUB_OUTPUT"

      - name: Update cna-api image
        if: inputs.api_image != ''
        env:
          API_IMAGE: ${{ inputs.api_image }}
        run: |
          az containerapp update \
            --name "${{ steps.names.outputs.api_app }}" \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --image "$API_IMAGE"

      - name: Update cna-worker image
        if: inputs.worker_image != ''
        env:
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: |
          az containerapp update \
            --name "${{ steps.names.outputs.worker_app }}" \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --image "$WORKER_IMAGE"

      - name: Update cna-web image
        if: inputs.web_image != ''
        env:
          WEB_IMAGE: ${{ inputs.web_image }}
        run: |
          az containerapp update \
            --name "${{ steps.names.outputs.web_app }}" \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --image "$WEB_IMAGE"

      - name: Verify cna-web health after update
        if: inputs.web_image != ''
        run: |
          sleep 20
          WEB_FQDN=$(az containerapp show \
            --name "${{ steps.names.outputs.web_app }}" \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${WEB_FQDN}/api/health" || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::cna-web /api/health returned $STATUS — check Application Insights for errors."
          fi

      - name: Summary
        run: |
          echo "## Refresh Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container App | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.api_image }}" ]; then
            echo "| \`${{ steps.names.outputs.api_app }}\` | \`${{ inputs.api_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ inputs.worker_image }}" ]; then
            echo "| \`${{ steps.names.outputs.worker_app }}\` | \`${{ inputs.worker_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ inputs.web_image }}" ]; then
            echo "| \`${{ steps.names.outputs.web_app }}\` | \`${{ inputs.web_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
