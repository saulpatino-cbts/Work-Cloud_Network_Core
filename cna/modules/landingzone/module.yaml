name: landingzone
version: 1.0.0
display_name: Cloud Landing Zone Assessment
status: installed
description: >
  Analysis layer over the network and security discovery modules — it
  performs no direct cloud discovery and makes no cloud API calls of its
  own. It documents and presents AWS and Azure landing zone architectures
  from the data those modules already collected.
  DD-011: Produces Mermaid-based detail documentation only —
  not deployable IaC. We present and recommend, we do not deploy.
depends_on: [network, security]
required_permissions:
  # None of its own. This module reads what the network and security
  # discovery modules already collected; it makes no direct cloud API
  # calls, so it needs no permissions beyond theirs.
  aws: []
  azure: []
ai_recommendations_enabled: true
