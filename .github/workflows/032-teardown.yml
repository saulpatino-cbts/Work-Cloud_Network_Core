name: "032 · Teardown Azure Platform"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: "Type DESTROY to confirm — this deletes ALL resources in the target environment"
        required: true
        type: string
      destroy_tfstate_backend:
        description: "Also destroy the configured Terraform state backend — only for full reset"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

concurrency:
  group: deploy-azure-platform-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── Safety gate ──────────────────────────────────────────────────────────────
  preflight:
    name: Preflight safety check
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation string
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "DESTROY" ]]; then
            echo "::error::Confirmation string must be exactly 'DESTROY'. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with teardown of ${{ github.event.inputs.environment }}."

      - name: Block prod teardown on non-default branch
        if: github.event.inputs.environment == 'prod'
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production teardown must be triggered from the main branch."
            exit 1
          fi

  # ── Terraform destroy ────────────────────────────────────────────────────────
  terraform-destroy:
    name: "terraform destroy (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    needs: preflight
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/azure/${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "~1.9"

      - uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.event.inputs.environment }}.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform destroy
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="api_image=ghcr.io/saulpatinojr/cna-api:latest" \
            -var="worker_image=ghcr.io/saulpatinojr/cna-worker:latest" \
            -var="web_image=ghcr.io/saulpatinojr/cna-web:latest" \
            -var="ghcr_pat=${{ secrets.GHCR_PAT }}" \
            -var="postgres_admin_password=${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}" \
            -var="nextauth_secret=${{ secrets.CNA_NEXTAUTH_SECRET }}" \
            -var="entra_client_id=${{ vars.CNA_ENTRA_CLIENT_ID }}" \
            -var="entra_client_secret=${{ secrets.CNA_ENTRA_CLIENT_SECRET }}" \
            -var="credential_encryption_key=${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}" \
            -var="foundry_claude_api_key=${{ secrets.FOUNDRY_CLAUDE_API_KEY }}"

  # ── Clean up drifted resources not in Terraform state ────────────────────────
  cleanup-drift:
    name: "Remove drifted resources (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    needs: terraform-destroy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview CNA cleanup targets
        run: pwsh -File ./scripts/cleanup-stale-ai-resources.ps1 -Environment "${{ github.event.inputs.environment }}" -Scope StaleAi

      - name: Delete drifted resources (not managed by Terraform)
        run: |
          pwsh -File ./scripts/cleanup-stale-ai-resources.ps1 -Environment "${{ github.event.inputs.environment }}" -Scope StaleAi -Delete

  # ── Optional: wipe TF state backend ─────────────────────────────────────────
  destroy-backend:
    name: "Destroy TF state backend"
    runs-on: ubuntu-latest
    needs: cleanup-drift
    if: github.event.inputs.destroy_tfstate_backend == 'true' && github.event.inputs.environment == 'dev'
    steps:
      - uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Terraform state backend resources
        run: |
          echo "WARNING: Deleting Terraform state backend. All state will be permanently lost."
          TF_STATE_RG="${{ vars.TFSTATE_RESOURCE_GROUP }}"

          az storage account delete \
            --name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            --resource-group "${TF_STATE_RG}" \
            --yes || true

          az group delete \
            --name "${TF_STATE_RG}" \
            --yes --no-wait || true

          echo "State backend deletion initiated (--no-wait). Run 000-bootstrap-backend to recreate."
