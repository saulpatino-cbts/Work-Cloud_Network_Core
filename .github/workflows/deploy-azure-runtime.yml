name: deploy-azure-runtime

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      api_image:
        description: API image reference
        required: true
        default: ghcr.io/saulpatinojr/cna-api:latest
        type: string
      worker_image:
        description: Worker image reference
        required: true
        default: ghcr.io/saulpatinojr/cna-worker:latest
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure-runtime-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/azure/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: terraform init -backend-config="key=${{ inputs.environment }}.terraform.tfstate"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan \
            -var="api_image=${{ inputs.api_image }}" \
            -var="worker_image=${{ inputs.worker_image }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/terraform/environments/azure/${{ inputs.environment }}/tfplan

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment == 'prod' && 'prod-approval' || inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/azure/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: terraform init -backend-config="key=${{ inputs.environment }}.terraform.tfstate"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/terraform/environments/azure/${{ inputs.environment }}

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  drift-detection:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/terraform/environments/azure/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: terraform init -backend-config="key=${{ matrix.environment }}.terraform.tfstate"

      - name: Terraform plan drift check
        run: |
          terraform plan -detailed-exitcode \
            -var="api_image=ghcr.io/saulpatinojr/cna-api:latest" \
            -var="worker_image=ghcr.io/saulpatinojr/cna-worker:latest"
