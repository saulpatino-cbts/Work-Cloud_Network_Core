name: network
version: 1.0.0
display_name: Cloud Network Assessment
status: installed
description: >
  Discovers and documents AWS and Azure network topology including VPCs,
  VNets, subnets, routing tables, Transit Gateways, VPN, ExpressRoute,
  peering connections, and Cloud WAN / Virtual WAN.
depends_on: []
required_permissions:
  aws:
    - ec2:DescribeVpcs
    - ec2:DescribeSubnets
    - ec2:DescribeRouteTables
    - ec2:DescribeInternetGateways
    - ec2:DescribeNatGateways
    - ec2:DescribeTransitGateways
    - ec2:DescribeTransitGatewayAttachments
    - ec2:DescribeTransitGatewayRouteTables
    - ec2:DescribeVpcPeeringConnections
    - ec2:DescribeVpnConnections
    - ec2:DescribeVpnGateways
    - ec2:DescribeCustomerGateways
    - directconnect:DescribeConnections
    - directconnect:DescribeVirtualInterfaces
    - networkmanager:GetNetworkTopology
    # BUILD-01 surpass-depth collectors (read-only, plus the one bounded
    # create/delete pair for the Reachability Analyzer flagship).
    - cloudwatch:GetMetricStatistics          # C1 network metrics
    - cloudwatch:GetMetricData                # C1 (batch form)
    - ec2:DescribeFlowLogs                    # C2 flow-log analysis
    - logs:StartQuery                         # C2 CloudWatch Logs Insights (bounded)
    - logs:GetQueryResults                    # C2
    - ec2:SearchTransitGatewayRoutes          # C3 TGW route analysis
    - ce:GetCostAndUsage                      # C4 Cost Explorer (30/60/90-day, bounded)
    # C6 FLAGSHIP Reachability Analyzer — creates and then DELETES a billable
    # path+analysis per tested pair (teardown is mandatory and automatic).
    - ec2:CreateNetworkInsightsPath
    - ec2:StartNetworkInsightsAnalysis
    - ec2:DescribeNetworkInsightsAnalyses
    - ec2:DeleteNetworkInsightsAnalysis
    - ec2:DeleteNetworkInsightsPath
  azure:
    - Microsoft.Network/virtualNetworks/read
    - Microsoft.Network/virtualNetworks/subnets/read
    - Microsoft.Network/routeTables/read
    - Microsoft.Network/virtualHubs/read
    - Microsoft.Network/virtualWans/read
    - Microsoft.Network/expressRouteCircuits/read
    - Microsoft.Network/virtualNetworkGateways/read
    - Microsoft.Network/localNetworkGateways/read
ai_recommendations_enabled: true
framework_mappings:
  - name: AWS Well-Architected Framework
    version: "2024"
    pillar: Reliability
  - name: Azure Well-Architected Framework
    version: "2024"
    pillar: Reliability
