# Dependabot — automated dependency updates
# Covers: Python packages (pip), GitHub Actions, Docker base images
#
# PR strategy:
#   - Python: weekly, grouped by ecosystem, auto-assign to saulpatinojr
#   - Actions: weekly, grouped — keeps CI action SHAs current
#   - Docker: weekly — keeps base image digest current

version: 2
updates:

  # Python dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    assignees:
      - saulpatinojr
    reviewers:
      - saulpatinojr
    labels:
      - dependencies
      - python
    groups:
      azure-sdk:
        patterns:
          - "azure-*"
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
      testing:
        patterns:
          - "pytest*"
          - "ruff"
          - "coverage"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    assignees:
      - saulpatinojr
    labels:
      - dependencies
      - github-actions
    groups:
      all-actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    assignees:
      - saulpatinojr
    labels:
      - dependencies
      - docker

  # npm — cna-web (Next.js 15, next-auth, Prisma, Azure SDKs)
  # Previously uncovered — next-auth beta and all Node.js dependencies
  # were not receiving automated update PRs.
  - package-ecosystem: npm
    directory: "/apps/cna-web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    assignees:
      - saulpatinojr
    reviewers:
      - saulpatinojr
    labels:
      - dependencies
      - npm
    ignore:
      # Prisma 7 requires the new prisma.config.ts datasource model. Keep Prisma
      # major upgrades manual until the schema/runtime migration is implemented.
      - dependency-name: "prisma"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@prisma/*"
        update-types:
          - "version-update:semver-major"
    groups:
      azure-sdk:
        patterns:
          - "@azure/*"
      next-ecosystem:
        patterns:
          - "next"
          - "next-auth"
          - "react"
          - "react-dom"
          - "@types/react*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
          - "@auth/prisma-adapter"
