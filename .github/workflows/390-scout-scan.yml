name: "390 · Scout Scan (published images)"

# Standalone, NON-BLOCKING vulnerability report for the images already published
# to Docker Hub. This is the companion to the regression gate in
# 200-build-images: 200 refuses to publish an image that INTRODUCES new fixable
# critical/high CVEs, while this workflow reports the CVEs the published images
# already carry, so base-image / OS-package remediation can be tracked and
# prioritised over time without blocking releases.
#
# It never fails the build pipeline. By default it reports (job summary + logs);
# set the `fail_on_critical` input to true in a manual run if you want an
# explicit red/green signal for a remediation push.
#
# Auth is keyless OIDC, exactly like 200-build-images (no stored token).

on:
  schedule:
    # Mondays 07:00 UTC — a weekly freshness check against new advisories.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      fail_on_critical:
        description: "Exit non-zero if any fixable CRITICAL CVE is found (for a remediation push). Default: report only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: Scout CVE report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # keyless Docker Hub OIDC login
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    strategy:
      fail-fast: false
      matrix:
        # The floating `*-latest` tags each image publishes (see 200-build-images
        # tag-images). The CLI image uses the bare `latest` tag.
        tag: [latest, api-latest, web-latest, worker-latest, migrator-latest]
    steps:
      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          # Pull-only is enough here; scope keeps the OIDC token off the public
          # helper-image pulls (same reason as 200-build-images).
          scope: ${{ vars.DOCKERHUB_NAMESPACE }}/cna@pull

      # Report fixable critical/high CVEs for this published tag. `exit-code` is
      # only turned on when the operator asked for a hard signal; by default the
      # step always succeeds and the findings live in the job summary + logs.
      - name: "Docker Scout — report CVEs (${{ matrix.tag }})"
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84  # v1.27.0
        with:
          command: cves
          image: registry://docker.io/${{ env.DOCKERHUB_NAMESPACE }}/cna:${{ matrix.tag }}
          organization: ${{ env.DOCKERHUB_NAMESPACE }}
          only-severities: critical,high
          only-fixed: true
          exit-code: ${{ inputs.fail_on_critical == true }}
          summary: true
