[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cna"
version = "0.1.0"
description = "Cloud Network Assessment Platform CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "boto3>=1.34",
    "azure-identity>=1.15",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-subscription>=3.0",
    "openai>=1.30",
    "diagrams>=0.24",
    "n2g>=0.3",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pandas>=2.1",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "httpx>=0.26",
]

[project.scripts]
cna = "cna.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
