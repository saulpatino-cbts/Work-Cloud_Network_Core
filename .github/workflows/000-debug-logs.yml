name: "000 · Debug — Pull Container App Logs"
# Temporary debug workflow to pull cna-web console logs.
# Delete after root cause is identified.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pull cna-web console logs (last 200 lines)
        run: |
          RG="rg-cna-${{ inputs.environment }}-scus"
          APP="ca-cna-${{ inputs.environment }}-scus-web"
          echo "=== Console logs for $APP ==="
          az containerapp logs show \
            --name "$APP" \
            --resource-group "$RG" \
            --type console \
            --follow false \
            --tail 200 2>&1 || echo "Failed to retrieve logs"

      - name: Query Application Insights for auth errors
        run: |
          APP_INSIGHTS="appi-cna-${{ inputs.environment }}-scus-platform"
          RG="rg-cna-${{ inputs.environment }}-scus"
          APP_ID=$(az monitor app-insights component show \
            --app "$APP_INSIGHTS" \
            --resource-group "$RG" \
            --query "appId" -o tsv 2>/dev/null || echo "")
          if [ -z "$APP_ID" ]; then
            echo "Could not find App Insights component ID"
            exit 0
          fi
          echo "=== Auth errors from App Insights (last 1h) ==="
          az monitor app-insights query \
            --app "$APP_ID" \
            --analytics-query "traces | where timestamp > ago(1h) and message contains '[auth]' | order by timestamp desc | take 50 | project timestamp, message, severityLevel" \
            -o table 2>/dev/null || echo "No traces found or query failed"
          echo "=== Exceptions (last 1h) ==="
          az monitor app-insights query \
            --app "$APP_ID" \
            --analytics-query "exceptions | where timestamp > ago(1h) | order by timestamp desc | take 20 | project timestamp, outerMessage, innermostMessage" \
            -o table 2>/dev/null || echo "No exceptions found or query failed"
