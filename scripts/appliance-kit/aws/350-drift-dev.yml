name: "350 · Drift Detection · dev"

@@SCAFFOLD_HEADER@@
# The schedule is intentionally absent until dev has been deployed once (the
# Azure appliance runs daily) — a scheduled scaffold would fail every day and
# tell nobody anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift-detection:
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Blocked on AWS account setup
        run: |
          echo "::error::350-drift-dev cannot run yet: there is no state backend to init against (REVIEW.md R-002) and no OIDC role to assume (R-003)."
          echo "::error::When there is, this job plans platform then workload with -detailed-exitcode against the images and ai_mode recorded in .deployment-catalog/dev/latest.json and warns on drift, then gains the daily schedule. Implementation: TODO.md T-102."
          exit 1
