name: "390 · Scan Published Images"

# Vulnerability scan of the container images this repository publishes, using
# Anchore Grype. It needs no Docker entitlement and no stored credential: it logs
# in to Docker Hub with the same keyless OIDC identity as 200-build-images
# (Docker Scout's backend rejects that identity, which is why 200 no longer scans).
#
# What it scans: exactly what the appliances deploy, the `digests{}` of
# `.deployment-catalog/latest-build.json` on main, which 200's
# `publish-build-manifest` job commits after every main publish
# (scripts/ci/resolve_scan_targets.py).
#
# Policy: a FIXABLE finding of severity HIGH or CRITICAL fails the job, so the check
# is red. Everything else (unfixable findings, MEDIUM and below) is reported in the
# job summary and in code scanning and gates nothing. The verdict is computed from
# the full Grype JSON report (scripts/ci/grype_report.py).
#
# What this does NOT do: stop a deploy. It runs after 200 has published and tagged,
# so it cannot gate an image that the appliances' poll may already have picked up.
# It is detection with a red check, not a release gate; the gate would have to live
# in 200 (before tagging) or in the appliances' 210/220.
#
# Triggers:
#   workflow_run   a 200 run finished. Scan only when it SUCCEEDED ON MAIN: 200 can
#                  be dispatched from a branch and still end `success` while it
#                  publishes nothing (no tag, no manifest), and scanning then would
#                  scan the previous release under a misleading trigger. Scan what
#                  the manifest on main says, whichever run that was.
#   schedule       Mondays 07:00 UTC: a freshness backstop, because new advisories
#                  land against images that have not changed.
#   workflow_dispatch  on demand, from main.
#
# Security of the trigger. `workflow_run` executes the DEFAULT-BRANCH copy of this
# file with repository secrets and an OIDC token available, whoever triggered 200.
# So this workflow checks out `main` only and never PR or fork code, and passes
# every `github.event.*` value to scripts through `env:`, never into a shell line.
#
# Independent signature check: each scanned digest is also verified with cosign
# against the identity the appliances trust (scripts/ci/verify_published_image.py).
# A pass is evidence that the appliances' own verification in 210/220 will pass; a
# failure is red here, in the core, before an appliance refuses a deploy.
#
# UNVERIFIED until the first run on main (a workflow_run, schedule or
# workflow_dispatch workflow must exist on the default branch first): the Docker Hub
# login for this workflow identity, the Grype step, the SARIF upload and the cosign
# verification. See TODO.md T-719.

on:
  workflow_run:
    # Must equal the `name:` of 200-build-images.yml exactly
    # (tests/unit/test_scan_workflow.py pins it).
    workflows: ["200 · Build Container Images"]
    types: [completed]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# One scan at a time; a scan that has started is never cancelled mid-upload.
# Pending runs collapse to the newest, which reads the manifest on main when it
# starts, so nothing is missed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # cosign release that verifies every image. This is the FOURTH pin to bump
  # together with the others named in CLAUDE.md (contract item 5): 200-build-images
  # (signs) and both appliances' 210/220 (verify) carry the same release.
  COSIGN_VERSION: v3.1.3
  # Lowest severity that fails the job when the finding is fixable.
  SCAN_FAIL_ON: high
  # The identity 200-build-images signs under and the builder id its provenance
  # records (CLAUDE.md contract item 5), which the appliances verify before a deploy.
  IMAGE_SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/200-build-images.yml@refs/heads/main
  SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  EXPECTED_BUILDER_PREFIX: ${{ github.server_url }}/${{ github.repository }}/actions/runs/

jobs:
  # Decide what to scan. Holds no OIDC token and no registry login: it only reads
  # the manifest committed to main.
  targets:
    name: Resolve scan targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # For workflow_run, scan only a 200 run that succeeded on main, in this
    # repository. Any other 200 run (failed, cancelled, dispatched from a branch)
    # publishes nothing new, so this job and the scan after it are skipped.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      has_targets: ${{ steps.resolve.outputs.has_targets }}
    steps:
      # A workflow_dispatch can select any branch, and that run would execute the
      # branch's copy of this file (and mint an OIDC token for it). Scan from main
      # only: the signing identity the appliances trust is a main-branch identity.
      - name: Require the default branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::390 scans from refs/heads/main only (this run is on '${RUN_REF}'); dispatch it from main."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .deployment-catalog

      - name: Resolve the digests to scan
        id: resolve
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/ci/resolve_scan_targets.py

  scan:
    name: Scan ${{ matrix.key }}
    needs: targets
    if: needs.targets.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # keyless Docker Hub OIDC login
      security-events: write  # upload SARIF to code scanning
    strategy:
      # One image failing the policy must not hide the others' results.
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      IMAGE_REF: ${{ matrix.ref }}
      IMAGE_KEY: ${{ matrix.key }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci

      # Keyless OIDC login, as in 200-build-images: GitHub mints an OIDC token for
      # this run, Docker Hub validates it against the connection whose ruleset
      # trusts this repository, and issues a short-lived token. Nothing is stored.
      # The token is scoped to <namespace>/cna by that ruleset; it is not narrowed
      # here.
      #
      # No `scope`: a scoped login is written to the Buildx config and is invisible
      # to everything that is not Buildx. Grype and cosign read the global Docker
      # config, so a scoped credential would give them none and the private
      # repository would answer 401. This job runs no Buildx build, so there is no
      # public helper-image pull for `scope` to protect.
      - name: Log in to Docker Hub
        id: login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Default is 300 s, shorter than a slow scan: a pull after that fails with
          # "401 incorrect username or password".
          DOCKERHUB_OIDC_EXPIREIN: "3600"
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Independent of the scan below: a signing problem is red even when the scan
      # is clean, and a scan problem is red even when the signature is good.
      - name: Verify signature and provenance
        run: python3 scripts/ci/verify_published_image.py "$IMAGE_REF"

      # The scan runs twice over the same immutable digest because the action emits
      # ONE format per invocation, and the two outputs need different things:
      #   - the verdict and the summary need EVERY match with its fix state, so the
      #     first pass keeps the full JSON (no `only-fixed`) and the policy is
      #     computed from it (grype_report.py), never from a filtered report;
      #   - code scanning needs SARIF, which only Grype can produce.
      # They cannot diverge: the second pass sets GRYPE_DB_AUTO_UPDATE=false so it
      # reads the vulnerability database the first pass just installed, and both
      # passes see the same image digest. Deriving SARIF from the JSON would mean
      # maintaining our own SARIF writer; running Grype outside the action would
      # mean an unpinned install. The cost is one more image read and catalog.
      #
      # `registry:` makes Grype pull straight from Docker Hub with the Docker
      # config credentials, not through a daemon. `by-cve` reports CVE ids rather
      # than GHSA ids. `fail-build: false` with `severity-cutoff: critical`: the
      # action's own gate is not the policy (it cannot see fixability once the
      # report is unfiltered); with the gate off the action only adds a warning when
      # a CRITICAL exists, which is informational. The Grype version is the one the
      # pinned action ships, so a Dependabot bump of the action moves it.
      - name: Scan with Grype (full JSON report)
        id: grype_json
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: registry:${{ matrix.ref }}
          output-format: json
          output-file: ${{ runner.temp }}/grype-${{ matrix.key }}.json
          fail-build: "false"
          severity-cutoff: critical
          only-fixed: "false"
          by-cve: "true"
          cache-db: "true"

      - name: Scan with Grype (SARIF, same database)
        id: grype_sarif
        if: ${{ !cancelled() && steps.grype_json.outcome == 'success' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_DB_AUTO_UPDATE: "false"
        with:
          image: registry:${{ matrix.ref }}
          output-format: sarif
          output-file: ${{ runner.temp }}/grype-${{ matrix.key }}.sarif
          fail-build: "false"
          severity-cutoff: critical
          only-fixed: "false"
          by-cve: "true"

      # The policy decision. Red when a fixable HIGH or CRITICAL finding exists, and
      # red when the report is missing, empty or unreadable: an empty report is never
      # a pass. No continue-on-error anywhere in this job.
      - name: Policy decision and job summary
        id: policy
        if: ${{ !cancelled() && steps.grype_json.outcome == 'success' }}
        env:
          JSON_REPORT: ${{ runner.temp }}/grype-${{ matrix.key }}.json
        run: |
          python3 scripts/ci/grype_report.py \
            --report "$JSON_REPORT" --name "$IMAGE_KEY" --image "$IMAGE_REF" \
            --fail-on "$SCAN_FAIL_ON"

      # Runs even when the policy step failed: a violation is exactly when the
      # alerts matter. A failed upload is a red step (and `wait-for-processing`, on
      # by default, also fails it when GitHub rejects the SARIF), never swallowed.
      # One category per image so each image's alerts are tracked, and closed when
      # fixed, independently. Alerts attach to main's latest commit, not to the
      # commit the image was built from.
      - name: Upload SARIF to code scanning
        id: upload
        if: ${{ !cancelled() && steps.grype_sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/grype-${{ matrix.key }}.sarif
          category: grype-${{ matrix.key }}
